services:
  mysql:
    image: mysql:8.4
    container_name: think-in-langgraph-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: langgraph
      MYSQL_USER: langgraph
      MYSQL_PASSWORD: langgraph
    ports:
      - "3307:3306"
    volumes:
      - langgraph_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ulanggraph -planggraph --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  langgraph_mysql_data:
